<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#f6f8fb" />
  <title>元素周期表 · 中文 / English / IPA</title>
  <meta name="description" content="可交互的中英双语元素周期表：中文名、英文名、IPA，以及中文和英文发音。" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">PERIODIC TABLE · 118 ELEMENTS</p>
        <h1>元素周期表 <span>中文 / English / IPA</span></h1>
        <p class="lede">点击任意元素，在周期表中央的大卡片中查看中文名、英文名和 IPA，并播放中文或英文发音。</p>
      </div>
      <a class="home-link" href="../" aria-label="返回主页">← Home</a>
    </header>

    <section class="table-section" aria-label="完整元素周期表">
      <div class="table-toolbar">
        <div class="legend" id="legend"></div>
        <div class="table-note">点击任意元素查看详情与发音</div>
      </div>

      <div class="periodic-scroll">
        <div class="periodic-board" id="periodicBoard">
          <div class="group-labels" id="groupLabels" aria-hidden="true"></div>
          <div class="period-labels" id="periodLabels" aria-hidden="true"></div>
          <div class="elements-grid" id="elementsGrid">
            <aside class="focus-card" id="focusCard" aria-live="polite">
              <div class="focus-number" id="focusNumber">1</div>
              <div class="focus-main">
                <div class="focus-symbol" id="focusSymbol">H</div>
                <div class="focus-copy">
                  <div class="focus-zh" id="focusZh" lang="zh-CN">氢</div>
                  <div class="focus-english" id="focusEnglish" lang="en">Hydrogen</div>
                  <div class="focus-ipa" id="focusIpa">/ˈhaɪdrədʒən/</div>
                  <div class="focus-category" id="focusCategory">非金属 · Nonmetal</div>
                </div>
              </div>
              <div class="focus-actions">
                <button class="voice-button" id="speakChineseButton" type="button">中文发音</button>
                <button class="voice-button voice-button-dark" id="speakEnglishButton" type="button">English</button>
              </div>
              <div class="voice-status" id="voiceStatus" aria-live="polite"></div>
            </aside>
          </div>
        </div>
      </div>

      <div class="f-block-wrap">
        <div class="f-row-label">镧系<br /><span>Lanthanides</span></div>
        <div class="f-row" id="lanthanides"></div>
        <div class="f-row-label">锕系<br /><span>Actinides</span></div>
        <div class="f-row" id="actinides"></div>
      </div>
    </section>

    <footer class="footer-note">
      <span>中文名称采用中国大陆简体规范名；英文名称采用 IUPAC 常用拼写。</span>
      <span class="sources"><a href="https://www.chemsoc.org.cn/library/a2611.html" target="_blank" rel="noreferrer">中文名称参考</a> · <a href="https://www.leskoff.com/s01707-0" target="_blank" rel="noreferrer">英文发音参考</a></span>
    </footer>
  </main>

  <script src="./elements.js"></script>
  <script src="./app.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="单对象时空行迹与历史事件的交互式播放器" />
  <title>单人模式 · Spacetime Trails</title>
  <script>
    if (location.pathname.endsWith('/index.html')) {
      location.replace(location.pathname.replace(/index\.html$/, '') + location.search + location.hash);
    }
  </script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./single-workbench.css" />
  <link rel="stylesheet" href="./single-cases.css" />
  <link rel="stylesheet" href="./single-mobile.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand-block">
        <div class="eyebrow">SPACETIME TRAILS · SINGLE</div>
        <div class="title-row">
          <h1 id="personName">时空行迹</h1>
          <span class="period" id="personPeriod">载入中…</span>
        </div>
        <p id="personSubtitle">选择一个人物或单轨迹案例，查看其地点、事件与移动。</p>
      </div>
      <nav class="mode-nav" aria-label="模式切换">
        <a class="ghost-button active" href="./" aria-current="page">单人模式</a>
        <a class="ghost-button" href="./compare.html">多人对比</a>
      </nav>
    </header>

    <section class="single-toolbar" aria-label="单人模式工具栏">
      <label class="person-switcher" for="personSelect">
        <span>对象</span>
        <select id="personSelect" aria-label="选择人物或特别案例"></select>
      </label>
      <button class="ghost-button" id="fitRouteBtn" type="button">总览路线</button>
      <button class="ghost-button" id="followBtn" type="button" aria-pressed="true">跟随：开</button>
      <label class="file-button">
        <span>载入 JSON</span>
        <input id="fileInput" type="file" accept="application/json,.json" />
      </label>
    </section>

    <section class="workspace">
      <div class="map-panel">
        <div id="map" aria-label="对象行迹地图"></div>
        <div class="map-overlay terrain-control" aria-label="地形图层控制">
          <label class="terrain-toggle">
            <input id="terrainToggle" type="checkbox" checked />
            <span>地形</span>
          </label>
          <label class="terrain-strength" for="terrainOpacity">
            <span>强度</span>
            <input id="terrainOpacity" type="range" min="0" max="70" value="34" step="1" />
            <output id="terrainOpacityValue" for="terrainOpacity">34%</output>
          </label>
        </div>
        <div class="map-overlay map-stats" aria-live="polite">
          <div><span class="stat-label">当前</span><strong id="currentPlace">—</strong></div>
          <div><span class="stat-label">累计行迹</span><strong id="distanceText">0 km</strong></div>
        </div>
        <div class="map-overlay legend">
          <span id="legendPast"><i class="legend-line past"></i> 已走</span>
          <span id="legendFuture"><i class="legend-line future"></i> 未走</span>
          <span id="legendPoint"><i class="legend-dot"></i> 事件</span>
        </div>
      </div>

      <aside class="story-panel" aria-label="当前事件">
        <div class="event-index" id="eventIndex">—</div>
        <div class="event-year" id="eventYear">—</div>
        <h2 id="eventTitle">载入中…</h2>
        <div class="place-line"><span class="place-dot"></span><span id="eventPlace">—</span></div>
        <p class="event-summary" id="eventSummary">正在载入数据。</p>
        <div class="event-tags" id="eventTags"></div>
        <div class="source-block"><span id="sourceLabel">史料提示</span><p id="eventSource">—</p></div>
        <div class="event-nav">
          <button id="prevEventBtn" type="button" aria-label="上一个事件">← 上一站</button>
          <button id="nextEventBtn" type="button" aria-label="下一个事件">下一站 →</button>
        </div>
      </aside>
    </section>

    <section class="timeline-panel" aria-label="时间轴与播放控制">
      <div class="playback-row">
        <button class="play-button" id="playBtn" type="button" aria-label="播放">▶</button>
        <div class="clock"><strong id="clockYear">—</strong><span id="clockPhase">—</span></div>
        <div class="speed-group" aria-label="播放速度">
          <button type="button" data-speed="0.5">0.5×</button>
          <button type="button" data-speed="1" class="active">1×</button>
          <button type="button" data-speed="2">2×</button>
          <button type="button" data-speed="4">4×</button>
        </div>
      </div>

      <div class="timeline-wrap">
        <div class="timeline-track" id="timelineTrack">
          <div class="timeline-progress" id="timelineProgress"></div>
          <div class="timeline-events" id="timelineEvents"></div>
          <input id="timeRange" type="range" min="0" max="1000" value="0" step="1" aria-label="单对象时间轴" />
        </div>
        <div class="timeline-labels"><span id="startYear">—</span><span id="endYear">—</span></div>
      </div>
      <p class="timeline-hint"><span id="timelineHintText">底图采用现代地理；历史地名和路线精度以数据说明为准。可拖动时间轴或点击地图节点。</span></p>
    </section>
  </main>

  <noscript>此工具需要启用 JavaScript。</noscript>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./compare-registry.js"></script>
  <script src="./single-person-router.js"></script>
  <script src="./single-bootstrap.js"></script>
  <script src="./single-mobile.js"></script>
  <script src="./single-age.js"></script>
</body>
</html>

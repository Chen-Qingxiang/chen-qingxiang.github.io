<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="多人时空行迹比较：任意有绝对年代的轨迹共享同一历史时间轴同步移动。" />
  <title>多人对比 · Spacetime Trails</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="./compare.css" />
  <link rel="stylesheet" href="./compare-workbench.css" />
</head>
<body>
  <main class="compare-shell">
    <header class="compare-header">
      <div class="header-title">
        <div class="eyebrow">SPACETIME TRAILS · MULTI-TRACK</div>
        <div class="title-line">
          <h1>多人时空对比</h1>
          <span>绝对年代行迹共享同一历史时钟</span>
        </div>
      </div>
      <nav class="header-links" aria-label="模式切换">
        <a href="./">单人模式</a>
        <a href="./compare.html" aria-current="page" style="font-weight:900">多人对比</a>
      </nav>
    </header>

    <section class="toolbar" aria-label="人物与时间范围">
      <div class="people-dropdown" id="peopleDropdown">
        <button class="people-toggle" id="peoplePickerToggle" type="button" aria-expanded="false" aria-controls="peoplePopover">
          <span class="people-toggle-label">人物</span>
          <span id="selectedPeopleSummary" class="selected-people-summary">载入中…</span>
          <span class="people-caret" aria-hidden="true">⌄</span>
        </button>
        <div class="people-popover" id="peoplePopover" hidden>
          <div class="people-tools">
            <input id="peopleSearch" type="search" placeholder="搜索人物 / 年代" aria-label="搜索人物" />
            <button class="soft-button compact" id="selectAllBtn" type="button">取消全选</button>
          </div>
          <div class="people-picks" id="peoplePicks"></div>
        </div>
      </div>

      <div class="mode-picks" role="group" aria-label="时间范围">
        <button type="button" data-range-mode="union" class="active">完整年代</button>
        <button type="button" data-range-mode="common">共同年代</button>
      </div>

      <div class="layout-picks" role="group" aria-label="地图与时间轴大小">
        <span>视图</span>
        <button type="button" data-layout="map" title="给地图更多空间">地图</button>
        <button type="button" data-layout="balanced" class="active" title="地图与时间轴均衡">均衡</button>
        <button type="button" data-layout="timeline" title="给时间轴更多空间">时间轴</button>
      </div>
      <button class="soft-button" id="fitBtn" type="button">总览路线</button>
    </section>

    <section class="main-grid" id="mainWorkspace">
      <div class="map-wrap">
        <div id="compareMap" aria-label="多人时空行迹地图"></div>
        <div class="map-card map-time-card">
          <span>当前历史时间</span>
          <strong id="mapTime">—</strong>
        </div>
        <div class="map-card terrain-card">
          <label><input id="terrainToggle" type="checkbox" checked /> 地形</label>
          <input id="terrainOpacity" type="range" min="0" max="70" value="30" step="1" aria-label="地形强度" />
          <output id="terrainValue">30%</output>
        </div>
        <div class="map-legend" id="mapLegend"></div>
      </div>

      <aside class="status-panel">
        <div class="status-head">
          <span>同一时刻</span>
          <strong id="statusTime">—</strong>
        </div>
        <div id="personStatusList" class="status-list"></div>
        <div class="overlap-box">
          <div class="overlap-title">时空接近</div>
          <div id="overlapList" class="overlap-list">当前没有检测到人物在同一地区。</div>
          <p>表示同一时刻地图位置接近，不等于史料确认见面。</p>
        </div>
      </aside>
    </section>

    <div class="workspace-splitter" id="workspaceSplitter" role="separator" aria-label="调整地图与时间轴大小" aria-orientation="horizontal" tabindex="0">
      <span></span>
    </div>

    <section class="timeline-section">
      <div class="playback-bar">
        <button id="playBtn" class="play-btn" type="button" aria-label="播放">▶</button>
        <div class="clock-block">
          <strong id="clockText">—</strong>
          <span id="clockNote">共享历史时钟</span>
        </div>
        <div class="speed-picks" role="group" aria-label="播放速度">
          <button type="button" data-speed="0.5" data-fixed-speed="0.5">0.5年/s</button>
          <button type="button" data-speed="1" data-fixed-speed="1" class="active">1年/s</button>
          <button type="button" data-speed="4" data-fixed-speed="4">4年/s</button>
          <button type="button" data-speed="16" data-fixed-speed="16">16年/s</button>
          <button type="button" data-speed="64" data-fixed-speed="64">64年/s</button>
          <button type="button" data-speed="1" data-speed-mode="full60">全程≈60秒</button>
        </div>
      </div>

      <div class="ruler-wrap">
        <div class="ruler-spacer">人物</div>
        <div class="ruler" id="ruler"></div>
        <div class="ruler-status">当前状态</div>
      </div>
      <div class="tracks-wrap" id="tracksWrap"></div>
      <div class="slider-row">
        <div></div>
        <div class="slider-box">
          <input id="masterRange" type="range" min="0" max="10000" step="1" value="0" aria-label="共享历史时间轴" />
        </div>
        <div></div>
      </div>
      <p class="timeline-note">粗色段＝驻留；细色段＝旅行；虚线＝位置资料未覆盖。年份始终线性。</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./compare-layer-capture.js"></script>
  <script src="./compare-registry.js"></script>
  <script src="./compare-default-all.js"></script>
  <script src="./compare.js"></script>
  <script src="./compare-ui.js"></script>
  <script src="./compare-selection-controls.js"></script>
  <script src="./compare-playback-follow.js"></script>
</body>
</html>
